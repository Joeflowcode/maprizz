<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Maprizz forms</title>
  </head>
  <body>
    <form name="tap-card-lead" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="tap-card-lead" />
      <input type="text" name="name" />
      <input type="text" name="business_name" />
      <input type="text" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="website" />
      <input type="text" name="city" />
      <input type="text" name="message" />
      <input type="text" name="referral_slug" />
      <input name="bot-field" />
    </form>
  </body>
</html>
