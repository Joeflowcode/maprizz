# Minimal Supabase CLI config. `supabase link --project-ref <ref>` then `supabase db push`.
[db]
major_version = 15

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://maprizz.com", "http://localhost:3000"]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
